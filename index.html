<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pet Projects</title>
<style>
:root {
    --bg: #07070a;
    --text: #ffffff;
    --text-sec: rgba(255,255,255,0.55);
    --accent: #00d4ff;
    --glass-bg: rgba(255, 255, 255, 0.035);
    --glass-border: rgba(255, 255, 255, 0.18);
    --glass-shadow: 0 8px 32px rgba(0,0,0,0.25), inset 0 0.5px 0 rgba(255,255,255,0.12);
    --card-hover: rgba(255,255,255,0.06);
}

@media (prefers-color-scheme: light) {
    :root {
        --bg: #f4f6fa;
        --text: #0b0b12;
        --text-sec: rgba(0,0,0,0.45);
        --accent: #0077b6;
        --glass-bg: rgba(255, 255, 255, 0.50);
        --glass-border: rgba(255, 255, 255, 0.55);
        --glass-shadow: 0 8px 32px rgba(0,0,0,0.06), inset 0 0.5px 0 rgba(255,255,255,0.6);
        --card-hover: rgba(0,0,0,0.04);
    }
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 20px;
    transition: background 0.4s ease;
}

.glass {
    background: var(--glass-bg);
    backdrop-filter: blur(60px) saturate(240%);
    -webkit-backdrop-filter: blur(60px) saturate(240%);
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow);
    border-radius: 28px;
}

header {
    text-align: center;
    margin-bottom: 48px;
    animation: fadeInDown 0.8s ease both;
}

header h1 {
    font-size: 42px;
    font-weight: 800;
    letter-spacing: -1.5px;
    margin-bottom: 12px;
    background: linear-gradient(135deg, var(--accent), #7ec8e3);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

header p {
    font-size: 17px;
    color: var(--text-sec);
    font-weight: 500;
    max-width: 480px;
    margin: 0 auto;
    line-height: 1.5;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
    width: 100%;
    max-width: 960px;
}

.card {
    display: flex;
    flex-direction: column;
    padding: 28px;
    text-decoration: none;
    color: inherit;
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.35s ease;
    animation: fadeInUp 0.7s ease both;
    cursor: pointer;
}

.card:nth-child(1) { animation-delay: 0.1s; }
.card:nth-child(2) { animation-delay: 0.2s; }
.card:nth-child(3) { animation-delay: 0.3s; }
.card:nth-child(4) { animation-delay: 0.4s; }

.card:hover {
    transform: translateY(-4px) scale(1.01);
    box-shadow: 0 20px 60px rgba(0,0,0,0.15), var(--glass-shadow);
    background: var(--card-hover);
}

.card-icon {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    margin-bottom: 18px;
    background: linear-gradient(135deg, rgba(0,212,255,0.15), rgba(0,119,182,0.15));
    border: 1px solid rgba(0,212,255,0.25);
    color: var(--accent);
}

.card h2 {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 8px;
    letter-spacing: -0.3px;
}

.card p {
    font-size: 14px;
    color: var(--text-sec);
    line-height: 1.5;
    flex: 1;
}

.card-arrow {
    margin-top: 20px;
    align-self: flex-end;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--input-bg, rgba(255,255,255,0.05));
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s, background 0.2s;
}

.card:hover .card-arrow {
    transform: translateX(3px);
    background: rgba(0,212,255,0.12);
}

.card-arrow::after {
    content: '';
    width: 6px;
    height: 6px;
    border-right: 2px solid var(--accent);
    border-top: 2px solid var(--accent);
    transform: rotate(45deg);
    margin-left: -1px;
}

footer {
    margin-top: 60px;
    font-size: 13px;
    color: var(--text-sec);
    text-align: center;
    animation: fadeInUp 0.8s 0.5s both;
}

@keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 640px) {
    header h1 { font-size: 32px; }
    .grid { grid-template-columns: 1fr; }
    body { padding: 40px 16px; }
}
</style>
</head>

<body>

<header>
    <h1>Pet projects</h1>
</header>

<main class="grid">

    <a href="./lens/index.html" class="card glass">
        <div class="card-icon">🔍</div>
        <h2>Оптика · Линза</h2>
        <p>Моделирование преломления света в сферической линзе. Визуализация хода лучей, фокусного расстояния и аберраций.</p>
        <div class="card-arrow"></div>
    </a>

    <a href="./EMWave/index.html" class="card glass">
        <div class="card-icon">⚡</div>
        <h2>Электромагнитная волна</h2>
        <p>Плоские и сферические электромагнитные волны. Поляризация, стоячие волны, интерференция и гауссовы пучки.</p>
        <div class="card-arrow"></div>
    </a>

</main>

</body>
</html>
